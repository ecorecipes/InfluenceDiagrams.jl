name = "influence_diagrams_proofs"
defaultTargets = ["InfluenceDiagramsProofs"]
# Share one dependency checkout across the ecosystem's proofs/ projects. See ADR 0005.
packagesDir = "../../.lake-packages"

# mdgen turns the `/-! ... -/` module docs into Markdown (`make mdgen`; see README "Documents").
# Pinned to the tag matching the toolchain; `main` tracks the newest Lean release candidate.
# Listed before mathlib: Lake lets the *last* `require` win, so Mathlib's pins (e.g. of `Cli`,
# which mdgen also needs) take precedence and `lake exe cache get` computes the right hashes.
[[require]]
name = "mdgen"
git = "https://github.com/Seasawher/mdgen"
rev = "v4.30.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

# The Bayesian-network schemas and finite model live in the sibling package's proofs project.
[[require]]
name = "bayesian_networks_proofs"
path = "../../BayesianNetworks.jl/proofs"

[[lean_lib]]
name = "InfluenceDiagramsProofs"

[[lean_exe]]
name = "emit_schema"
root = "Main"
